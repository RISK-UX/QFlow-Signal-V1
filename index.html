<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Qflow Signal</title><style>
*{box-sizing:border-box}body{margin:0;background:#081222;color:#e8efff;font:15px system-ui}button,input,textarea,select{font:inherit;border-radius:8px;padding:10px;border:1px solid #32445f;background:#14233b;color:#fff}button{cursor:pointer}button.primary{background:#2864ee;border:0}aside{width:210px;position:fixed;height:100vh;background:#0e1a2d;padding:24px 14px}aside button{display:block;width:100%;text-align:left;background:none;border:none;margin:5px 0}aside button.active{background:#203c69}main{margin-left:210px;padding:30px;max-width:1250px}h1{font-size:28px;margin:0}small,.muted{color:#9caec9}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.stat,.signal{background:#12213a;border:1px solid #263b58;border-radius:14px;padding:20px;margin-bottom:12px}.stat b{font-size:30px;display:block}.signal h3{margin:10px 0}.score{float:right;color:#6aa6ff;font-size:24px;font-weight:700}.tag{display:inline-block;border:1px solid #415577;padding:4px 8px;border-radius:20px;margin:4px}textarea{display:block;width:100%;min-height:85px;margin:12px 0}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.login{max-width:400px;margin:18vh auto;background:#12213a;padding:30px;border-radius:18px}.login input{width:100%;margin:20px 0}a{color:#88b8ff}#app[hidden],#login[hidden]{display:none}@media(max-width:700px){aside{position:static;width:100%;height:auto}aside button{display:inline;width:auto}main{margin:0;padding:15px}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div id=login class=login><h1>Qflow Signal</h1><p class=muted>Private dealership intent intelligence</p><form id=loginform><input id=password type=password placeholder="Admin password" required><button class=primary>Sign in</button></form><p id=err></p></div><div id=app hidden><aside><h2>Qflow <span style="color:#6aa6ff">Signal</span></h2><small>INTENT INTELLIGENCE</small><nav id=nav></nav></aside><main><small>QUALIFLOW / AUTOMOTIVE</small><h1 id=heading></h1><p class=muted>Discover → prioritize → respond. Never auto-post.</p><div id=content></div></main></div><script>
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data,view='Dashboard',query='',min=0;const tabs=['Dashboard','Live Signals','High Intent','Authors','Approved','Ignored','Analytics','Settings'];async function api(path,body){const r=await fetch('/api/'+path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error((await r.json()).error);return r.json()};async function load(){data=await api('signals');$('login').hidden=true;$('app').hidden=false;render()};$('loginform').onsubmit=async e=>{e.preventDefault();try{await api('login',{password:$('password').value});$('password').value='';await load()}catch(e){$('err').textContent=e.message}};function render(){ $('nav').innerHTML=tabs.map(t=>`<button class="${view===t?'active':''}" data-tab="${t}">${t}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{view=b.dataset.tab;render()});$('heading').textContent=view;let s=data.signals, auto=s.filter(x=>x.automotive), high=auto.filter(x=>x.score>=75), approved=s.filter(x=>x.status==='approved'),ignored=s.filter(x=>x.status==='ignored');let c=$('content');if(view==='Settings'){c.innerHTML=`<div class=signal><p>Notification threshold</p><input id=threshold type=number min=50 max=100 value="${data.settings.threshold}"><p>Subreddits (configuration only)</p><input id=subs value="${esc(data.settings.subreddits)}"><p>Keywords (configuration only)</p><input id=keys value="${esc(data.settings.keywords)}"><p><button id=save class=primary>Save settings</button> <button id=seed>Load 10 mock signals</button> <button id=testai>Run fresh AI test</button> <button id=syncprowlo>Import Prowlo matches</button></p><small>Webhook provider must be configured separately. No live author enrichment.</small></div>`;$('save').onclick=async()=>{await api('settings',{threshold:$('threshold').value,subreddits:$('subs').value,keywords:$('keys').value});await load()};$('testai').onclick=async()=>{const b=$('testai');b.disabled=true;try{const r=await api('test-ai',{});alert('Analysis: '+r.mode+' | Score: '+r.score+'/100');await load()}catch(e){alert(e.message)}finally{b.disabled=false}};$('syncprowlo').onclick=async()=>{const b=$('syncprowlo');b.disabled=true;try{const r=await api('prowlo-sync',{});alert('Imported '+r.imported+'; skipped '+r.skipped+(r.more_available?' (more records available)':''));await load()}catch(e){alert(e.message)}finally{b.disabled=false}};$('seed').onclick=async()=>{await api('seed',{});await load()};return}if(view==='Authors'){c.innerHTML=[...new Set(auto.map(x=>x.author))].map(a=>`<div class=signal><b>${esc(a)}</b><p>${auto.filter(x=>x.author===a).length} observed signals · Activity score unavailable (no authorized history source)</p></div>`).join('')||'No authors yet';return}if(view==='Analytics'){c.innerHTML=`<div class=signal>Signals detected: ${s.length}<p>High intent: ${high.length}</p><p>Approved: ${approved.length} · Ignored: ${ignored.length}</p><p>Average fit: ${auto.length?Math.round(auto.reduce((n,x)=>n+x.score,0)/auto.length):'—'}</p></div>`+Object.entries(auto.flatMap(x=>x.categories).reduce((a,k)=>(a[k]=(a[k]||0)+1,a),{})).map(([k,n])=>`<div class=signal>${esc(k)} · ${n}</div>`).join('');return}let stats=view==='Dashboard'?`<div class=stats>${[['Detected',s.length],['High intent',high.length],['Approved',approved.length],['In-app alerts',s.filter(x=>x.notified&&x.status==='new').length]].map(([k,v])=>`<div class=stat><small>${k}</small><b>${v}</b></div>`).join('')}</div>`:'';let list=view==='Approved'?approved:view==='Ignored'?ignored:view==='High Intent'?high.filter(x=>x.status==='new'):view==='Live Signals'?s.filter(x=>x.status==='new'):auto.filter(x=>x.status==='new');list=list.filter(x=>x.score>=min&&JSON.stringify(x).toLowerCase().includes(query.toLowerCase())).sort((a,b)=>b.score-a.score);c.innerHTML=stats+`<div class=toolbar><input id=search placeholder="Search signals" value="${esc(query)}"><select id=min><option value=0>All scores</option><option value=50>50+</option><option value=75>75+</option><option value=90>90+</option></select></div>`+list.map(x=>`<article class=signal data-id="${esc(x.id)}"><span class=score>${x.score}/100</span><small>r/${esc(x.subreddit)} · ${esc(x.source)} · ${esc(x.mode)}</small><h3>${esc(x.title)}</h3><small>u/${esc(x.author)} · ${esc(x.timestamp)} · Author activity: unavailable</small><p>${esc(x.body)}</p>${x.categories.map(k=>`<span class=tag>${esc(k)}</span>`).join('')}${x.notified?'<span class=tag>High-priority alert</span>':''}<p>${esc(x.why)}</p><textarea>${esc(x.draft)}</textarea><div class=toolbar><button class=primary data-action=approve>Approve & copy</button><button data-action=edit>Save edit</button><button data-action=ignore>Ignore</button><a href="${esc(x.url)}" target=_blank rel=noopener>Open Reddit</a></div></article>`).join('')+(list.length?'':'<div class=signal>No matching signals. Load mock events in Settings.</div>');$('min').value=min;$('min').onchange=e=>{min=+e.target.value;render()};$('search').onchange=e=>{query=e.target.value;render()};c.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{let el=b.closest('article'),x=s.find(x=>x.id===el.dataset.id),action=b.dataset.action,draft=el.querySelector('textarea').value;let reason=action==='ignore'?prompt('Optional ignore reason','')||'':'';try{if(action==='approve'){await navigator.clipboard.writeText(draft);window.open(x.url,'_blank','noopener')}await api('action',{id:x.id,action,draft,reason});await load()}catch(e){alert(e.message)}})};load().catch(()=>{});
</script></body></html>
