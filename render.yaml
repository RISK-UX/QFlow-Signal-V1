services:
  - type: web
    name: qflow-signal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: qflow-signal-db
          property: connectionString
databases:
  - name: qflow-signal-db
    plan: free
    ipAllowList: []
